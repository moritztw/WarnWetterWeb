services:
  warnwetter-web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: warnwetter-web
    restart: unless-stopped
    ports:
      # Standard: Port 3000 auf allen Interfaces.
      # Hinter lokalem Reverse-Proxy (Nginx/Caddy/Pangolin): z. B. HOST_BIND=127.0.0.1:3000 setzen.
      - "${HOST_BIND:-3000}:3000"
    environment:
      NODE_ENV: production
      TZ: Europe/Berlin
      CACHE_TTL_MS: "${CACHE_TTL_MS:-180000}"
      BRIGHTSKY_BASE_URL: "${BRIGHTSKY_BASE_URL:-https://api.brightsky.dev}"
      GEOCODING_BASE_URL: "${GEOCODING_BASE_URL:-https://geocoding-api.open-meteo.com/v1}"
      DWD_ICON_BASE_URL: "${DWD_ICON_BASE_URL:-https://api.open-meteo.com/v1/dwd-icon}"
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    security_opt:
      - no-new-privileges:true
    mem_limit: 256m
